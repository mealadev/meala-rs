[package]
name = "meala-rs"
version = "0.1.0"
edition = "2021"
authors = ["Brandon Himpfen <brandon@brandonhimpfen.com>"]
description = "High-performance Rust CLI and library for UAV flight log normalization (MAVLink/CSV -> Apache Parquet + SQLite) and edge server sync."
license = "MIT"
repository = "https://github.com/mealadev/meala-rs"
homepage = "https://meala.dev"
keywords = ["uav", "mavlink", "ardupilot", "parquet", "telemetry"]
categories = ["aerospace", "command-line-utilities", "science"]

[lib]
name = "meala_core"
path = "src/lib.rs"

[[bin]]
name = "meala-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arrow = { version = "54.0", default-features = false, features = ["prettyprint"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
mavlink = { version = "0.14", default-features = false, features = ["std", "ardupilotmega", "common"] }
parquet = { version = "54.0", default-features = false, features = ["arrow", "snap"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
